name: sync-html
on:
  push:
    paths:
      - trigger.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch page
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o index.html "https://aka.doubaocdn.com/s/owCOXRNF3V"
          wc -c index.html
      - name: commit
        run: |
          git config user.name "milkland-bot"
          git config user.email "milkland-bot@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync index.html" || echo "no changes"
          git push
